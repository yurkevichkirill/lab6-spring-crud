spring.application.name=user-service
server.port=8081

# Адрес сервера Order-Service (Eureka не используется)
order-service.url=http://localhost:8082

# Таймауты Feign-клиента order-service (мс)
spring.cloud.openfeign.client.config.order-service.connect-timeout=2000
spring.cloud.openfeign.client.config.order-service.read-timeout=5000
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Fallback через Spring Cloud CircuitBreaker (Resilience4j) вместо удалённого Hystrix
spring.cloud.openfeign.circuitbreaker.enabled=true
# TimeLimiter должен быть больше суммарного времени попыток Retryer
resilience4j.timelimiter.configs.default.timeout-duration=15s
